server {
    listen 80;
    listen [::]:80;
    server_name ludo.tracyyun.cn;

    root /www/wwwroot/ludo/current;
    index index.html;
    charset utf-8;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ludo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/ludo.tracyyun.cn.log;
    error_log /www/wwwlogs/ludo.tracyyun.cn.error.log;
}
