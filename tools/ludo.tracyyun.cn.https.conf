server {
    listen 80;
    listen [::]:80;
    server_name ludo.tracyyun.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/ludo/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ludo.tracyyun.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ludo.tracyyun.cn;

    ssl_certificate /www/server/panel/vhost/nginx/certificates/ludo.tracyyun.cn/fullchain.cer;
    ssl_certificate_key /www/server/panel/vhost/nginx/certificates/ludo.tracyyun.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    root /www/wwwroot/ludo/current;
    index index.html;
    charset utf-8;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/ludo.tracyyun.cn.log;
    error_log /www/wwwlogs/ludo.tracyyun.cn.error.log;
}
